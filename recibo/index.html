<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recibo de pago · Nexo Multiservicios</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/publico.css">
  <style>
    .rc { max-width: 560px; margin: 26px auto 0; }
    .rc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .rc-top img { height: 40px; width: auto; }
    .rc-n { text-align: right; font-size: 13px; color: var(--muted); }
    .rc-n b { display: block; font-family: var(--font-serif); font-size: 26px; font-weight: 500; color: var(--ink); }
    .rc-monto { padding: 24px 0 18px; text-align: center; }
    .rc-monto span { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
    .rc-monto b { display: block; margin-top: 6px; font-family: var(--font-serif); font-size: 54px; font-weight: 500; line-height: 1; }
    .rc-ok { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 5px 12px; border-radius: 999px; background: var(--accent-50); color: var(--accent); font-size: 12.5px; font-weight: 700; }
    .rc-ok svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.6; }
    .rc-row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
    .rc-row span { color: var(--muted); }
    .rc-row b { text-align: right; font-weight: 600; }
    .rc-saldo { margin-top: 14px; padding: 14px 16px; border-radius: 14px; background: var(--stone-50); display: flex; justify-content: space-between; font-size: 14.5px; }
    .rc-pie { margin-top: 18px; font-size: 12.5px; color: var(--muted); text-align: center; }
    @media print { body { background: #ffffff; } .p-card { padding: 0; } }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol></svg>
<header class="p-top"><div class="container">
  <a href="../" class="brand" aria-label="Nexo Multiservicios"><img class="brand-logo" src="../assets/img/logo.svg" alt="Nexo" width="92" height="20"><span class="brand-divider"></span><span class="brand-sub">Recibo<br>de pago</span></a>
</div></header>
<main class="p-main"><div class="container">
  <div class="p-card rc" id="card">
    <div id="cargando" class="muted" style="text-align:center">Cargando recibo…</div>
    <div id="recibo" hidden>
      <div class="rc-top">
        <img src="../assets/img/logo.svg" alt="Nexo Multiservicios" width="120" height="27">
        <div class="rc-n">Recibo<b id="num"></b><span id="fecha"></span></div>
      </div>
      <div class="rc-monto"><span>Monto recibido</span><b id="monto"></b><div class="rc-ok"><svg><use href="#i-check"/></svg>Pagado</div></div>
      <div class="rc-row"><span>Cliente</span><b id="cliente"></b></div>
      <div class="rc-row" id="r-serv"><span>Servicio</span><b id="servicio"></b></div>
      <div class="rc-row"><span>Método de pago</span><b id="metodo"></b></div>
      <div class="rc-row" id="r-nota"><span>Concepto</span><b id="nota"></b></div>
      <div class="rc-saldo" id="r-saldo"><span>Saldo pendiente de este servicio</span><b id="saldo"></b></div>
      <p class="rc-pie">Nexo Multiservicios · Houston, Texas<span id="tel"></span><br>Gracias por tu confianza.</p>
    </div>
  </div>
  <div class="p-actions" id="acciones" hidden style="max-width:560px;margin-inline:auto;justify-content:center">
    <button class="btn btn-primary" id="pdf" type="button"><span class="btn-label">Descargar PDF</span></button>
    <button class="btn btn-ghost" type="button" onclick="window.print()"><span>Imprimir</span></button>
  </div>
</div></main>
<footer class="p-foot">Nexo Multiservicios · Houston, Texas</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/backend.js"></script>
<script src="../assets/js/efectos.js"></script>
<script src="../assets/js/recibo.js"></script>
</body>
</html>
