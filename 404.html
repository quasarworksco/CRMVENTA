  <style>
    .simple { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 100px 0 60px; position: relative; overflow: hidden; isolation: isolate; }

    .acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 34px; }
    .sello { width: 92px; height: 92px; margin: 0 auto 30px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: #fff; animation: aparecer-card .9s var(--spring) both; }
    .sello svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; animation: trazo .8s .5s var(--ease) forwards; }
    .grande { font-family: var(--font-serif); font-size: clamp(140px, 30vw, 300px); line-height: .8; color: transparent; -webkit-text-stroke: 1px var(--ink); }
  </style>
